<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <style>
        .premium-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1045 100%);
        }
    </style>
</head>


<body class="premium-bg text-slate-100 font-sans min-h-screen relative flex flex-col justify-between antialiased p-6">


    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0 opacity-20">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-purple-500 rounded-full blur-[128px]"></div>
        <div class="absolute top-1/2 -left-40 w-80 h-80 bg-indigo-500 rounded-full blur-[96px]"></div>
    </div>
    
    <header class="w-full h-4 z-10 relative"></header>

    <main class="w-full max-w-7xl mx-auto flex-grow flex items-center justify-center z-10 relative my-6">
        <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl shadow-2xl w-full max-w-2xl p-8 relative">
            
           
            <h1 class="text-3xl font-black tracking-tight text-center mb-2 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                APF Voting System
            </h1>
            <p class="text-center text-xs text-slate-400 mb-8 font-medium"> This voting system is for educational purposes. (our class work)</p>

                <div class="mt-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="border border-slate-800/80 bg-slate-950/40 rounded-xl p-5 transition-all duration-200 hover:border-slate-700/60 shadow-md flex flex-col justify-between">
                            <div>
                                <h2 class="text-xl font-extrabold text-white tracking-wide text-center">
                                    Augustine
                                </h2>
                                <p class="text-center text-xs font-mono text-slate-400 mt-1">
                                    Current Votes: <span id="cardCountAugustine" class="font-bold text-indigo-400">0</span>
                                </p>
                            </div>
                            <button type="button" onclick="selectCandidate('Augustine')" id="btnAugustine" class="w-full mt-5 bg-blue-600 text-white text-xs font-bold uppercase tracking-wider py-3 rounded-lg hover:bg-blue-700 active:scale-[0.98] transition-all shadow-md focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-950">
                                Vote Augustine
                            </button>
                        </div>

                        <div class="border border-slate-800/80 bg-slate-950/40 rounded-xl p-5 transition-all duration-200 hover:border-slate-700/60 shadow-md flex flex-col justify-between">
                            <div>
                                <h2 class="text-xl font-extrabold text-white tracking-wide text-center">
                                    Kosisochukwu
                                </h2>
                                <p class="text-center text-xs font-mono text-slate-400 mt-1">
                                    Current Votes: <span id="cardCountKosisochukwu" class="font-bold text-emerald-400">0</span>
                                </p>
                            </div>
                            <button type="button" onclick="selectCandidate('Kosisochukwu')" id="btnKosisochukwu" class="w-full mt-5 bg-emerald-600 text-white text-xs font-bold uppercase tracking-wider py-3 rounded-lg hover:bg-emerald-700 active:scale-[0.98] transition-all shadow-md focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-950">
                                Vote Kosisochukwu
                            </button>
                        </div>

                    </div>
                </div>
        


          <!-- Include this script tag or install `@tailwindplus/elements` via npm: -->
<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script> -->

<label for="select" class="block text-sm/6 font-medium text-white mt-6" >VERIFIED VOTERS</label>
<div class="mt-2  block w-full max-w-xs">
  <div class="relative grid grid-cols-1">
    
    <select 
      id="option-list" 
      name="selected" 
      class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white/5 py-1.5 pr-8 pl-3 text-left text-sm/6 text-white outline-1 -outline-offset-1 outline-white/10 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 bg-gray-800">
      <option value="Loveth" class="bg-gray-800 text-white">Loveth</option>
      <option value="Christopher" class="bg-gray-800 text-white">Christopher</option>
      <option value="Abigail" class="bg-gray-800 text-white">Abigail</option>
      <option value="Chidimma" class="bg-gray-800 text-white">Chidimma</option>
      <option value="Lillian" class="bg-gray-800 text-white">Lillian</option>
      <option value="Charles" class="bg-gray-800 text-white">Charles</option>
      <option value="Stephanie" class="bg-gray-800 text-white">Stephanie</option>
      <option value="Rita" class="bg-gray-800 text-white">Rita</option>
      <option value="James" class="bg-gray-800 text-white">James</option>
      <option value="Peter" class="bg-gray-800 text-white">Peter</option>
      <option value="Anthony" class="bg-gray-800 text-white">Anthony</option>
      <option value="Victor" class="bg-gray-800 text-white">Victor</option>
      <option value="David" class="bg-gray-800 text-white">David</option>
      <option value="Augustine" class="bg-gray-800 text-white">Augustine</option>
      <option value="Kosisochukwu" class="bg-gray-800 text-white">Kosisochukwu</option>
      <option value="Bonaventure" class="bg-gray-800 text-white">Bonaventure</option>
      <option value="Ifeanyi" class="bg-gray-800 text-white">Ifeanyi</option>
      <option value="Majesty" class="bg-gray-800 text-white">Majesty</option>
      <option value="Amarachi" class="bg-gray-800 text-white">Amarachi</option>
      <option value="Victor" class="bg-gray-800 text-white">Victor</option>
    </select>

    <svg 
      viewBox="0 0 16 16" 
      fill="currentColor" 
      aria-hidden="true" 
      class="pointer-events-none col-start-1 row-start-1 size-5 self-center justify-self-end mr-2 text-gray-400 sm:size-4">
      <path d="M5.22 10.22a.75.75 0 0 1 1.06 0L8 11.94l1.72-1.72a.75.75 0 1 1 1.06 1.06l-2.25 2.25a.75.75 0 0 1-1.06 0l-2.25-2.25a.75.75 0 0 1 0-1.06ZM10.78 5.78a.75.75 0 0 1-1.06 0L8 4.06 6.28 5.78a.75.75 0 0 1-1.06-1.06l2.25-2.25a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
    </svg>
    
  </div>
</div>

        </div>
    </main>


    <footer class="w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-stretch md:items-end gap-6 z-10 relative pt-4 border-t border-slate-800/60">
        
        <!-- Include this script tag or install `@tailwindplus/elements` via npm: -->
<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script> -->
<!-- Trigger Button -->
<button 
  onclick="document.getElementById('election-dialog').showModal()" 
  class="rounded-md bg-white/10 p-8 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 transition-colors">
  Check Result
</button>

<dialog 
  id="election-dialog" 
  aria-labelledby="dialog-title" 
  class="fixed inset-0 m-auto p-0 border-0 rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 max-w-lg w-full backdrop:bg-gray-900/50 backdrop:backdrop-blur-sm open:animate-fade-in">
  
  <div class="p-4 sm:p-6">
    <div class="sm:flex sm:items-start">
      
      <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-blue-500/10 sm:mx-0 sm:size-10">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6 text-blue-400" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.03 0 1.9.732 2.076 1.704m-7.443 0a48.654 48.654 0 0 1 1.123-.08m-5.801 0C4.845 2.016 4 2.979 4 4.108V19.5A2.25 2.25 0 0 0 6.25 21.75h2.25" />
        </svg>
      </div>
      <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
        <h3 id="dialog-title" class="text-base font-semibold text-white">
          Live Election Results
        </h3>
        <div class="mt-2">
          <p id="winnerTitle" class="text-sm font-medium text-gray-200">
            Next Head of House
          </p>
          <p id="winnerMessage" class="mt-1 text-sm text-gray-400">
            No votes counted yet.
          </p>
        </div>
      </div>
      
    </div>
  </div>

  <div class="bg-gray-700/25 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 gap-2">
    <button 
      type="button" 
      onclick="document.getElementById('election-dialog').close()" 
      class="inline-flex w-full justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-500 sm:w-auto transition-colors">
      Refresh Tally
    </button>
    <button 
      type="button" 
      onclick="document.getElementById('election-dialog').close()" 
      class="mt-3 inline-flex w-full justify-center rounded-md bg-white/10 px-4 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto transition-colors">
      Close
    </button>
  </div>
</dialog>

        
        <div class="w-full md:w-96 bg-slate-900/60 backdrop-blur-xl p-5 rounded-2xl border border-slate-800/80 shadow-2xl flex flex-col gap-4">      
            <div class="flex items-center justify-between border-b border-slate-800/60 pb-3">
                <div class="flex items-center gap-2">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                    </span>
                    <h2 class="text-[11px] font-black tracking-widest text-indigo-400 uppercase">
                        Election Results
                    </h2>
                </div>
                <div class="text-[10px] font-mono font-bold px-2 py-0.5 bg-slate-950 rounded-full border border-slate-800 text-slate-400 flex items-center gap-1">
                    TOTALS: <span id="totalVotes">0</span>
                </div>
            </div>
<!-- 
            <div class="group">
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">AUGUSTINE</span>
                    <span class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">0</span>
                </div>
            </div>
            <div class="group">
                <div class="flex justify-between items-baseline mb-1">
                    <span class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">KOSISOCHUKWU</span>
                    <span class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">0</span>
                </div>
            </div> -->
        </div>
    </footer>

    
<script src="logic.js"></script>
</body>
</html>
